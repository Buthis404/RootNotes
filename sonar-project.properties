sonar.projectKey=RootNotes
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.ruff_cache/**,**/__pycache__/**,.git/**,.scannerwork/**,data/**,docs/screenshots/**,frontend/node_modules/**,frontend/src/test/**
sonar.test.inclusions=backend/tests/**/*,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

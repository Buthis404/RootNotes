services:
  db:
    image: postgres:16-alpine
    container_name: rtnotes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rtnotes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rtnotes_secret}
      POSTGRES_DB: ${DB_NAME:-rtnotes}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rtnotes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rtnotes_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-rtnotes}:${DB_PASSWORD:-rtnotes_secret}@db:5432/${DB_NAME:-rtnotes}
      UPLOAD_ROOT: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: rtnotes_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: rtnotes_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:

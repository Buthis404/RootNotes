<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RootNotes</title>
  <link rel="icon" type="image/svg+xml" id="favicon-link" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090b'/%3E%3Cpath d='M16 4 L27 8 L27 17 C27 23 22 28 16 30 C10 28 5 23 5 17 L5 8 Z' fill='%2315bbb1' opacity='0.18'/%3E%3Cpath d='M16 4 L27 8 L27 17 C27 23 22 28 16 30 C10 28 5 23 5 17 L5 8 Z' fill='none' stroke='%2315bbb1' stroke-width='1.5'/%3E%3Cpath d='M11 16 L14.5 19.5 L21 13' stroke='%2315bbb1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{width:100%;height:100%;overflow:hidden;}
    body{font-family:'JetBrains Mono',monospace;background:#08090b;color:#c8cdd6;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#2a2d35;border-radius:2px;}
    ::-webkit-scrollbar-thumb:hover{background:#3a3d48;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.022;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:128px 128px;}
    @keyframes dash{to{stroke-dashoffset:-40}}
    @keyframes spin{to{transform:rotate(360deg)}}
    input,textarea,select{font-family:'JetBrains Mono',monospace;color:#c8cdd6;}
    input::placeholder,textarea::placeholder{color:#303540;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
